# Lead Scout Bot Role
# Per CONTRACTS_MVO.md §0.A.4.1 - lead_scout_bot contract

role_id: lead_scout_bot
version: "1.0.0"
purpose: |
  Governed lead acquisition for the LinkSites MVO.
  The MVO path acquires the Principal-approved mock demo lead under a supplied
  LinkSkills lease and records provenance/audit. Live Maps/search is prepared
  as a future provider but remains blocked until Principal approval.

# Module binding
module: linksites
module_version: "2.0.0"

# Inputs and outputs
inputs:
  - lead_input            # Principal-approved mock demo lead facts
  - acquisition_notes     # Optional operator notes
  - governance            # LinkSkills lease_id, idempotency key, mode

outputs:
  - lead_record_ref       # Governed mock CRM/lead reference
  - lead_provenance       # Provider, lease, audit, and source refs

# MVO status
enabled_in_mvo: true
declared_in_mvo: true

# Allowed capabilities in MVO runtime path
allowed_capabilities:
  - cap.research.public_web   # Mock provider now; live Maps/search later
  - cap.crm.odoo_shadow       # Mock/shadow lead reference only
  - cap.zulip.run_messaging   # Run/operator trace status
  - cap.plane.execution_tracking

# Allowed skills in MVO runtime path
allowed_skills: []  # No skills in MVO path

# Development restrictions for MVO
development_restrictions:
  - mock_mode_for_mvo
  - lease_required
  - no_live_acquisition
  - no_public_scraping
  - live_maps_requires_principal_approval

# Audit events
audit_events:
  - role.started
  - lead.acquired
  - provenance.recorded
  - role.completed
  - role.failed

# Model policy
model_policy:
  model_routing_profile: lead-scout-v1
  max_tokens: 0

# Memory rules
memory_rules:
  read_scopes: []
  write_scopes: []

# Channel permissions
channel_permissions:
  read: []
  write: []

# LiNKguard cleanup profile
cleanup_profile: minimal_session

# Explicit non-ownership
explicit_non_ownership:
  - canonical_memory          # LiNKbrain owns
  - capability_leases         # LinkSkills owns
  - secrets_lifecycle       # LinkSkills owns
  - deterministic_workflow_state  # LiNKautowork owns
  - final_audit             # LiNKbrain owns
  - crm_schema_definitions  # External CRM owns
  - target_app_configuration  # Target apps own their config

# Outreach Bot Role
# Per CONTRACTS_MVO.md §0.A.4.1 - outreach_bot contract

role_id: outreach_bot
version: "1.0.0"
purpose: |
  Future outreach drafting/sending role for post-MVO phases.
  NOT enabled in v2 MVO - role declared but skipped.

# Module binding
module: linksites
module_version: "2.0.0"

# Inputs and outputs
inputs:
  - lead_record_ref         # Future: lead reference
  - website_package         # Future: website package summary

outputs:
  # No outputs in v1 MVO; role skip evidence only

# MVO status
enabled_in_mvo: false
declared_in_mvo: true

# Allowed capabilities in MVO runtime path
allowed_capabilities: []  # No capabilities in MVO path

# Allowed skills in MVO runtime path
allowed_skills: []  # No skills in MVO path

# Development restrictions for MVO
development_restrictions:
  - disabled_in_mvo
  - no_outreach_draft
  - no_outreach_send
  - no_external_contact

# Audit events (only skip evidence)
audit_events:
  - role.declared
  - role.skipped

# Model policy (not used in MVO due to disabled status)
model_policy:
  model_routing_profile: outreach-v1
  max_tokens: 4000

# Memory rules
memory_rules:
  read_scopes: []
  write_scopes: []

# Channel permissions
channel_permissions:
  read: []
  write: []

# LiNKguard cleanup profile
cleanup_profile: minimal_session

# Explicit non-ownership
explicit_non_ownership:
  - message_channel_configuration  # Channel config stays in engines
  - send_policy_approvals           # LinkSkills/LiNKaios own approvals
  - communication_logs_as_canonical_audit  # LiNKbrain owns audit
  - email_delivery_infrastructure # External providers own delivery

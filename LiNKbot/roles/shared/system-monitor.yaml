# System Monitor Role
# Per CONTRACTS_MVO.md §6.1 - LiNKbot role attachment model

role_id: system_monitor
version: "1.0.0"
purpose: |
  Monitor system health across all planes, detect anomalies,
  report status to operators, and coordinate cleanup with LiNKguard.
  Does not execute remediation actions directly.

# Module access (system-wide)
allowed_modules:
  - linksites
  - linkapps
  - lexos
  - linktrend-media
  - linktrend-development
  - linktrend-admin

# Capability connectors
allowed_capabilities:
  - cap.zulip.run_messaging   # For health alerts

# LinkSkills skills
allowed_skills:
  - health.probe.run
  - metrics.read
  - anomaly.detect
  - alert.emit

# Memory and context rules
memory_rules:
  read_scopes:
    - system.health
    - plane.metrics
    - tenant.aggregates
  write_scopes: []  # System monitor does not write canonical memory

# Model and runtime policy
model_policy:
  model_routing_profile: system-monitor-v1
  max_tokens: 2000
  temperature: 0.1
  tool_subset:
    - health.probe
    - metrics.query
    - alert.format

# Audit events this role emits
audit_events:
  - role.started
  - role.completed
  - health.check
  - anomaly.detected
  - alert.emitted
  - role.failed

# LiNKguard cleanup profile
cleanup_profile: monitoring_session

# Channel permissions
channel_permissions:
  read:
    - "zulip:streams/monitoring"
    - "zulip:streams/health"
  write:
    - "zulip:streams/alerts"
    - "zulip:topics/health-*"

# Development restrictions for MVO
development_restrictions:
  - alert_only_no_remediation
  - no_capability_execution
  - no_direct_cleanup_commands  # LiNKguard owns cleanup

declared_in_mvo: true
enabled_in_mvo: true

# Role contract non-ownership (explicit)
explicit_non_ownership:
  - remediation_execution         # LiNKguard/LinkSkills own
  - cleanup_authority             # LiNKguard owns
  - canonical_health_state        # LiNKbrain owns
  - alert_persistence             # LiNKbrain owns
  - metrics_storage               # LiNKbrain owns

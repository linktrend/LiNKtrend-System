# LiNKdev factory heartbeat — scheduled trigger for agent watch.
# GitHub `schedule` on the watch workflow alone has not fired in production (L-004);
# this workflow uses cron, workflow_dispatch, and workflow_run (throttled) to wake watch.

name: LiNKdev factory heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'CI'
      - 'LiNKdev dispatch'
      - 'LiNKdev agent watch'
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    concurrency:
      group: linkdev-factory-heartbeat-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Throttle — skip if agent watch ran recently
        id: throttle
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          last=$(gh run list --workflow="LiNKdev agent watch" --repo "${{ github.repository }}" \
            --branch main --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [[ -z "$last" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_epoch=$(date -d "$last" +%s)
          now=$(date +%s)
          age=$((now - last_epoch))
          if [[ $age -lt 480 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Agent watch ran ${age}s ago — throttled"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger LiNKdev agent watch
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.throttle.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "LiNKdev agent watch" \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Queued LiNKdev agent watch from heartbeat"

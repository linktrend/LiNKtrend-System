# DEPRECATED (Tier 2): canonical copy at LiNKskills/capability-connectors/cap.plane.execution_tracking.yaml
---
# Declaration-only capability plugin manifest — LiNKapps Plane execution tracking (mock-first, aligns LinkSites pack).
# Sources: LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.6, §3, §4; CONTRACTS_MVO.md §0.A.5.1.
manifest_version: '1.0'
plugin_kind: capability
kind_version: semantic
capability_id: cap.plane.execution_tracking
vertical_family: linkapps.app_factory

target_software:
  product: Plane
  role_description: >-
    Mock project/task identities and sprint counters anchored to LiNKbrain — live workspace mutation is future-only.

default_execution_mode: mock
live_execution_policy:
  status: disabled_by_default
  requires_tenant_opt_in: true
  requires_distinct_lease_policies: true

allowed_operations:
  - id: project.ensure_mock
    lease_permissions:
      - plane.project.write
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: task.ensure_mock
    lease_permissions:
      - plane.task.write
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: sprint.track_stub
    lease_permissions:
      - plane.sprint.track
      - plane.task.write
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: readiness.probe
    lease_permissions:
      - plane.readiness.check
    writes_side_effect: false
    mode_routing:
      mock: not_offered
      shadow: allowed
      live: future_requires_opt_in

auth_requirements:
  note: Declare handles only — never embed secrets in manifests or repo.
  tenant_config_refs:
    - plane.base_url
    - plane.workspace_ref
    - plane.api_key_ref
    - plane.project_template_ref
  requires_linkskills_registration: true

mode_flags:
  mvo_modes:
    - development
  supported_capability_modes:
    - mock
    - shadow
    - live
  live_workspace_mutation:
    default: disabled

lease_requirements:
  linkskills_permissions_hint:
    - plane.project.write
    - plane.task.write
    - plane.sprint.track
    - plane.readiness.check
  mandatory_lease_claims:
    - tenant_id
    - run_id_or_work_request_id
    - lease_id
    - idempotency_key
    - originating_stage_id

idempotency_rules:
  template: "${tenant_id}:${run_id}:${stage_id}:${capability_id}:${operation}:${stable_scope_segment}"
  stable_scope_segment_by_operation:
    project.ensure_mock: "normalized_project_title|venture_id"
    task.ensure_mock: "normalized_task_title:${issue_group}|optional_body_hash"
    sprint.track_stub: "${iteration}:${squad_iteration_scope}"
    readiness.probe: "tenant_id:${probe_window_floor_ts}"
  collision_policy: >-
    Replay identical key returns original outcome; divergent args → LEASE_IDEMPOTENCY_CONFLICT.

audit_events:
  minimum_outcomes:
    - capability.requested
    - capability.executed
    - plane.task.upserted
    - plane.readiness.checked
    - capability.failed

allowed_callers:
  - linkaios
  - vertical_plugin
  - linkautowork

failure_mapping:
  INTEGRATION_UNAVAILABLE: Workspace connectivity or DNS failure.
  INTEGRATION_AUTH_FAILED: API key rejected or workspace scope mismatch.
  LEASE_DENIED: Policy/kill-switch; live route disabled.
  LEASE_REQUEST_INVALID: Invalid titles/ids or malformed execution scope.
  INTEGRATION_TIMEOUT: API deadline exceeded.
  LEASE_KILL_SWITCH: Tenant/global halt on Plane tier.
  LEASE_IDEMPOTENCY_CONFLICT: Same key, divergent task/project payload.

kill_switch_registration:
  scope: capability_kill_switch
  optional_operation_subscope: true

not_configured:
  - Enterprise portfolio taxonomy, client-facing PM methodology, RACI redesign.
  - SLA legal contracts with clients or governance outside connector configuration.

---
# Declaration-only capability plugin manifest — LiNKapps Expo Application Services (build/submit) connector surface.
# Sources: LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.5, §3, §4; CONTRACTS_MVO.md §0.A.5.1.
manifest_version: '1.0'
plugin_kind: capability
kind_version: semantic
capability_id: cap.eas.build
vertical_family: linkapps.app_factory

target_software:
  product: Expo (EAS)
  role_description: >-
    Placeholder skip path for mobile-off tenants; real cloud builds and store submits are future-only and gated.

default_execution_mode: mock
live_execution_policy:
  status: disabled_by_default
  requires_tenant_opt_in: true
  requires_distinct_lease_policies: true

allowed_operations:
  - id: build.skip_placeholder
    lease_permissions:
      - eas.build.plan
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: not_applicable
  - id: build.trigger
    lease_permissions:
      - eas.build
    writes_side_effect: true
    mode_routing:
      mock: denied_unless_mobile_track_enabled_in_tenant_policy
      shadow: not_offered
      live: future_only
  - id: submit.app_store_future
    lease_permissions:
      - eas.submit.release
    writes_side_effect: true
    mode_routing:
      mock: denied
      shadow: not_offered
      live: future_only

auth_requirements:
  note: Declare handles only — never embed secrets in manifests or repo.
  tenant_config_refs:
    - eas.project_ref
    - eas.token_ref
    - apple.connect_ref
  requires_linkskills_registration: true

mode_flags:
  mvo_modes:
    - development
  supported_capability_modes:
    - mock
    - shadow
    - live
  mobile_track:
    default: off_in_mvo
    unauthorized_live_while_disabled: routes_to_LEASE_DENIED

lease_requirements:
  linkskills_permissions_hint:
    - eas.build.plan
    - eas.build
    - eas.submit.release
  mandatory_lease_claims:
    - tenant_id
    - run_id_or_work_request_id
    - lease_id
    - idempotency_key
    - originating_stage_id

idempotency_rules:
  template: "${tenant_id}:${run_id}:${stage_id}:${capability_id}:${operation}:${stable_scope_segment}"
  stable_scope_segment_by_operation:
    build.skip_placeholder: "app_slug:mobile_gate"
    build.trigger: "eas_platform_profile_digest"
    submit.app_store_future: "release_candidate_tag"
  collision_policy: >-
    Replay identical key returns original outcome; divergent args → LEASE_IDEMPOTENCY_CONFLICT.

audit_events:
  minimum_outcomes:
    - capability.requested
    - capability.executed
    - eas.build.skipped
    - eas.build.failed
    - capability.failed

allowed_callers:
  - linkautowork
  - vertical_plugin

failure_mapping:
  LEASE_DENIED: Mobile track disabled while requesting real build/submit; manifest restriction active.
  LEASE_REQUEST_INVALID: Malformed platform profile or missing release gate inputs.
  INTEGRATION_AUTH_FAILED: Expo or Apple credential invalid.
  INTEGRATION_UNAVAILABLE: Provider quota or outage; may map provider “quota” class here per integrator policy.
  INTEGRATION_TIMEOUT: Long-running build/submit deadline exceeded.
  MANIFEST_INVALID: Project ref not registered for tenant.
  LEASE_IDEMPOTENCY_CONFLICT: Same key, divergent artifact digest vs prior execution.

kill_switch_registration:
  scope: capability_kill_switch
  optional_operation_subscope: true

not_configured:
  - Enterprise Apple portal policies, phased releases, Crashlytics, store listing copy.
  - Physical device provisioning or MDM rollout.

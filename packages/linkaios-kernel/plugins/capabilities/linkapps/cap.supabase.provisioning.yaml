---
# Declaration-only capability plugin manifest — LiNKapps Supabase provisioning connector surface.
# Sources: LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.2, §3, §4; CONTRACTS_MVO.md §0.A.5.1.
manifest_version: '1.0'
plugin_kind: capability
kind_version: semantic
capability_id: cap.supabase.provisioning
vertical_family: linkapps.app_factory

target_software:
  product: Supabase
  role_description: >-
    Project fixture scaffolding, offline/workspace migrations, mock RLS packs — not SaaS org provisioning in MVO default.

default_execution_mode: mock
live_execution_policy:
  status: disabled_by_default
  requires_tenant_opt_in: true
  requires_distinct_lease_policies: true

allowed_operations:
  - id: project.scaffold_stub
    lease_permissions:
      - supabase.project.stub
      - supabase.project.create
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: migration.apply_workspace
    lease_permissions:
      - supabase.schema.apply
      - supabase.migrate.run
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: rls.pack.apply_mock
    lease_permissions:
      - supabase.rls.configure
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: readiness.probe
    lease_permissions:
      - supabase.readiness.check
    writes_side_effect: false
    mode_routing:
      mock: not_offered
      shadow: allowed
      live: allowed_with_readiness_lease

auth_requirements:
  note: Declare handles only — never embed secrets in manifests or repo.
  tenant_config_refs:
    - supabase.organization_ref
    - supabase.management_api_ref
    - supabase.fixture_profile_ref
  requires_linkskills_registration: true

mode_flags:
  mvo_modes:
    - development
  supported_capability_modes:
    - mock
    - shadow
    - live
  cloud_project_create:
    default: disabled
    enablement: explicit_future_packet_plus_opt_in

lease_requirements:
  linkskills_permissions_hint:
    - supabase.project.stub
    - supabase.schema.apply
    - supabase.rls.configure
    - supabase.readiness.check
  mandatory_lease_claims:
    - tenant_id
    - run_id_or_work_request_id
    - lease_id
    - idempotency_key
    - originating_stage_id

idempotency_rules:
  template: "${tenant_id}:${run_id}:${stage_id}:${capability_id}:${operation}:${stable_scope_segment}"
  stable_scope_segment_by_operation:
    project.scaffold_stub: "app_slug"
    migration.apply_workspace: "migration_lockfile_digest|offline_flag"
    rls.pack.apply_mock: "fixture_pack_digest"
    readiness.probe: "tenant_id:${probe_window_floor_ts}"
  collision_policy: >-
    Replay identical key returns original outcome; divergent args → LEASE_IDEMPOTENCY_CONFLICT.

audit_events:
  minimum_outcomes:
    - capability.requested
    - capability.executed
    - linkapps.services.provisioned
    - supabase.migration.applied
    - capability.failed

allowed_callers:
  - linkautowork
  - vertical_plugin

failure_mapping:
  MANIFEST_INVALID: Invalid fixture profile, unknown schema mapping before discovery.
  INTEGRATION_AUTH_FAILED: PAT/management API invalid.
  INTEGRATION_UNAVAILABLE: Offline template path, provider outage; retryable where policy says so.
  LEASE_DENIED: Destructive apply without lease, mocked mode blocks cloud path.
  LEASE_EXPIRED: TTL elapsed mid-run — retryable after re-request.
  LEASE_KILL_SWITCH: Tenant/global halt on Supabase tier.
  LEASE_REQUEST_INVALID: Malformed migration scope or RLS pack hash mismatch.
  LEASE_IDEMPOTENCY_CONFLICT: Same key, divergent migration inputs vs prior execution.

kill_switch_registration:
  scope: capability_kill_switch
  optional_operation_subscope: true

not_configured:
  - SaaS tenancy pricing, quotas, HIPAA/BA exposure decisions inside Supabase console.
  - Postgres extension enablement unrelated to scaffolded template without discovery.
  - Application business schema/content model invented without WP-042-class discovery.

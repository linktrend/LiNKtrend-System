---
# Declaration-only capability plugin manifest — LiNKapps app-factory GitHub connector surface.
# Sources: LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.1, §3, §4; CONTRACTS_MVO.md §0.A.5.1.
manifest_version: '1.0'
plugin_kind: capability
kind_version: semantic
capability_id: cap.github.repo_management
vertical_family: linkapps.app_factory

target_software:
  product: GitHub
  role_description: >-
    Starter-kit repo materialization, local git workspace actions, and (future) upstream push —
    governed exclusively through LinkSkills leases; no direct Pat/OAuth literals in repo.

default_execution_mode: mock
live_execution_policy:
  status: disabled_by_default
  requires_tenant_opt_in: true
  requires_distinct_lease_policies: true
  notes: >-
    Live GitHub-hosted shells and push.ref require explicit opt-in; MVO routes repo scaffolding through mock/local paths.

allowed_operations:
  - id: repo.create_from_template
    lease_permissions:
      - github.repo.template_materialize
      - github.repo.write
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: connectivity_probe_class_only
      live: future_requires_opt_in
  - id: repo.init_local
    lease_permissions:
      - github.repo.write
      - git.local.init
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: remote.register
    lease_permissions:
      - github.repo.configure
    writes_side_effect: false
    mode_routing:
      mock: allowed
      shadow: allowed
      live: future_requires_opt_in
  - id: commit.apply
    lease_permissions:
      - github.commit.write
      - github.repo.write
    writes_side_effect: true
    mode_routing:
      mock: allowed
      shadow: not_offered
      live: future_requires_opt_in
  - id: push.ref
    lease_permissions:
      - github.push.deploy
    writes_side_effect: true
    mode_routing:
      mock: denied_default_no_guarded_upstream
      shadow: not_offered
      live: future_only
  - id: connectivity.probe
    lease_permissions:
      - github.readiness.check
    writes_side_effect: false
    mode_routing:
      mock: not_offered
      shadow: allowed
      live: allowed_with_readiness_lease

auth_requirements:
  note: Declare handles only — never embed secrets in manifests or repo.
  tenant_config_refs:
    - github.org_ref
    - github.app_installation_ref
    - github.pat_ref
    - github.oauth_actor_ref
    - github.default_branch_policy_ref
    - remote.url_template
  requires_linkskills_registration: true

mode_flags:
  mvo_modes:
    - development
  supported_capability_modes:
    - mock
    - shadow
    - live
  push_and_live_hosted_repos:
    default: disabled
    enablement: explicit_tenant_configuration_only

lease_requirements:
  linkskills_permissions_hint:
    - github.repo.template_materialize
    - github.repo.configure
    - github.commit.write
    - github.repo.write
    - github.push.deploy
    - git.local.init
  mandatory_lease_claims:
    - tenant_id
    - run_id_or_work_request_id
    - lease_id
    - idempotency_key
    - originating_stage_id

idempotency_rules:
  template: "${tenant_id}:${run_id}:${stage_id}:${capability_id}:${operation}:${stable_scope_segment}"
  stable_scope_segment_by_operation:
    repo.create_from_template: "app_slug|template_ref|workspace_root_hash"
    repo.init_local: "app_repo_digest_pre_init|workspace_path_id"
    remote.register: "normalized_remote_url_sha"
    commit.apply: "parents_head_sha|patch_set_hash"
    push.ref: "local_head_sha|remote_name|ref_name"
  collision_policy: >-
    Replay identical key returns original outcome; divergent canonical args under same key → LEASE_IDEMPOTENCY_CONFLICT.

audit_events:
  minimum_outcomes:
    - capability.requested
    - capability.executed
    - linkapps.repo.scaffolded
    - github.commit.recorded
    - capability.failed

allowed_callers:
  - linkautowork
  - vertical_plugin
  - linkaios
caller_notes:
  linkbot_policy: excluded_from_direct_lease_issuer
  kernel_may_issue_on_behalf: true

failure_mapping:
  LEASE_REQUEST_INVALID: Malformed slug/path, mismatched normalized hash vs stored execution.
  INTEGRATION_AUTH_FAILED: Missing installation/PAT, OAuth refresh failure, unauthorized actor.
  LEASE_DENIED: Policy/kill-switch, mocked mode forbids outbound push, live route not enabled.
  LEASE_KILL_SWITCH: capability_kill_switch or tenant halt on GitHub tier.
  INTEGRATION_UNAVAILABLE: GitHub outage, DNS/TLS upstream of gateway.
  INTEGRATION_TIMEOUT: Outbound deadline exceeded.
  MANIFEST_INVALID: Unknown manifest ref, bad remote template registration.
  LEASE_IDEMPOTENCY_CONFLICT: Same key, divergent payload vs prior execution artifact.

kill_switch_registration:
  scope: capability_kill_switch
  optional_operation_subscope: true

not_configured:
  - Repository permission model beyond connector args, CODEOWNERS, branch protection taxonomy.
  - Codespaces policy, Actions workflow design beyond manifest-declared scaffolding hooks.
  - Enterprise audit log retention or org-wide security policy authoring.

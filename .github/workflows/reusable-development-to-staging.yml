name: Reusable Development To Staging

on:
  workflow_call:

jobs:
  merge-development-into-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Configure git
        run: |
          git config user.name "linktrend-promotion-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge development into staging
        run: |
          set -euo pipefail

          git fetch origin development staging
          git checkout staging
          git reset --hard origin/staging

          merge_message="chore(promote): merge development into staging"
          if git merge --no-edit --no-commit --no-ff -X theirs origin/development; then
            echo "Development merged cleanly into staging."
          else
            echo "Merge reported conflicts; preferring development branch contents."
            while IFS= read -r path; do
              if git show ":3:${path}" >/dev/null 2>&1; then
                git checkout --theirs -- "${path}"
                git add "${path}"
              else
                git rm -f --ignore-unmatch "${path}"
              fi
            done < <(git diff --name-only --diff-filter=U)
            merge_message="chore(promote): merge development into staging preferring development"
          fi

          # Automated branch promotion should not rewrite workflow files because
          # GitHub Actions token permissions vary by repo and can reject these pushes.
          git restore --source origin/staging --staged --worktree .github/workflows || true
          git add -A

          if git diff --cached --quiet; then
            echo "No staging updates to push."
            git merge --abort 2>/dev/null || true
            git reset --hard origin/staging
            exit 0
          fi

          git commit -m "${merge_message}"

          if git diff --quiet origin/staging..HEAD; then
            echo "No staging updates to push."
            exit 0
          fi

          git push origin HEAD:staging

name: Reusable Staging To Main

on:
  workflow_call:

jobs:
  merge-staging-into-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "linktrend-release-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge staging into main
        run: |
          set -euo pipefail

          git fetch origin main staging
          git checkout main
          git reset --hard origin/main

          if git merge --no-edit --no-ff -X theirs origin/staging; then
            echo "Staging merged cleanly into main."
          else
            echo "Merge reported conflicts; preferring staging branch contents."
            while IFS= read -r path; do
              if git show ":3:${path}" >/dev/null 2>&1; then
                git checkout --theirs -- "${path}"
                git add "${path}"
              else
                git rm -f --ignore-unmatch "${path}"
              fi
            done < <(git diff --name-only --diff-filter=U)

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): merge staging into main preferring staging"
            fi
          fi

          if git diff --quiet origin/main..HEAD; then
            echo "No main updates to push."
            exit 0
          fi

          git push origin HEAD:main


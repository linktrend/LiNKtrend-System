name: chatwoot

services:
  rails:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - linktrend-network
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=linktrend-network
      - traefik.http.routers.chatwoot.rule=Host(`chatwoot.linktrend.internal`)
      - traefik.http.routers.chatwoot.entrypoints=websecure
      - traefik.http.routers.chatwoot.tls=true
      - traefik.http.services.chatwoot.loadbalancer.server.port=3000
      - traefik.http.routers.chatwoot-http.rule=Host(`chatwoot.linktrend.internal`)
      - traefik.http.routers.chatwoot-http.entrypoints=web
      - traefik.http.routers.chatwoot-http.middlewares=chatwoot-redirect
      - traefik.http.middlewares.chatwoot-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.chatwoot-redirect.redirectscheme.permanent=true

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - linktrend-network

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatwoot_postgres:/var/lib/postgresql/data
    networks:
      - linktrend-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - .env
    volumes:
      - chatwoot_redis:/data
    networks:
      - linktrend-network

volumes:
  chatwoot_storage:
  chatwoot_postgres:
  chatwoot_redis:

networks:
  linktrend-network:
    external: true
  traefik:
    external: true

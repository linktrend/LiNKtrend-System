# Capability Connector: cap.eas.build
# Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.5 and CONTRACTS_MVO.md §0.A.5.1

plugin_id: cap.eas.build
plugin_kind: capability
plugin_name: Expo Application Services (EAS) Build
version: "1.0.0-mvo"
purpose: Governed EAS builds and app store submissions for mobile tracks

modes_supported:
  - mock
  - shadow
  - live

operations:
  - operation_id: build.skip_placeholder
    description: Record rationale (mobile off/default in MVO)
    default_mode: mock
    lease_skus:
      - eas.build.plan
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:build.skip_placeholder:${app_slug}:mobile_gate"
    allowed_callers:
      - linkautowork
      - vertical_plugin
    failure_mapping:
      unauthorized_live: LEASE_DENIED

  - operation_id: build.trigger
    description: Trigger EAS build for iOS/Android
    default_mode: live
    modes_disabled_in_mvo:
      - mock
    lease_skus:
      - eas.build
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:build.trigger:${eas_platform_profile_digest}"
    allowed_callers:
      - linkautowork
    failure_mapping:
      provider_quota: INTEGRATION_UNAVAILABLE
      auth_failed: INTEGRATION_AUTH_FAILED
      unauthorized_live: LEASE_DENIED

  - operation_id: submit.app_store_future
    description: Submit to App Store / Play Store
    default_mode: live
    modes_disabled_in_mvo:
      - mock
      - shadow
    lease_skus:
      - eas.submit.release
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:submit.app_store_future:${release_candidate_tag}"
    allowed_callers:
      - linkautowork
    failure_mapping:
      submission_rejected: POLICY_REQUIRES_APPROVAL
      auth_failed: INTEGRATION_AUTH_FAILED

auth_config_surface:
  - eas.project_ref
  - eas.token_ref
  - apple.connect_ref

audit_events:
  - capability.requested
  - capability.executed
  - eas.build.skipped
  - eas.build.failed
  - capability.failed

non_ownership:
  - Physical device provisioning
  - MDM rollout
  - Phased release pacing inside App Store Connect
  - Enterprise Apple portal policies
  - Crashlytics configuration
  - Store listing copy management

required_by_modules:
  - linkapps.app_factory

notes: >
  Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.5: Mobile track is optional and
  off by default in MVO. EAS operations default to skip placeholders.
  Live builds require explicit tenant opt-in and are deferred post-MVO.

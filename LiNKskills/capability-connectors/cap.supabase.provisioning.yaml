# Capability Connector: cap.supabase.provisioning
# Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.2 and CONTRACTS_MVO.md §0.A.5.1

plugin_id: cap.supabase.provisioning
plugin_kind: capability
plugin_name: Supabase Provisioning
version: "1.0.0-mvo"
purpose: Governed Supabase project and schema management

modes_supported:
  - mock
  - shadow
  - live

operations:
  - operation_id: project.scaffold_stub
    description: Record supabase_project_ref fixture
    default_mode: mock
    lease_skus:
      - supabase.project.stub
      - supabase.project.create
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:project.scaffold_stub:${app_slug}"
    allowed_callers:
      - linkautowork
      - vertical_plugin
    failure_mapping:
      invalid_fixture: MANIFEST_INVALID
      token_invalid: INTEGRATION_AUTH_FAILED

  - operation_id: migration.apply_workspace
    description: Run repo migrations locally/offline
    default_mode: mock
    lease_skus:
      - supabase.schema.apply
      - supabase.migrate.run
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:migration.apply_workspace:${migration_lockfile_digest}|${offline_flag}"
    allowed_callers:
      - linkautowork
      - vertical_plugin
    failure_mapping:
      migration_failed: WORKFLOW_STEP_FAILED
      destructive_without_lease: LEASE_DENIED

  - operation_id: rls.pack.apply_mock
    description: Apply fixture RLS pack to mock DB
    default_mode: mock
    lease_skus:
      - supabase.rls.configure
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:rls.pack.apply_mock:${fixture_pack_digest}"
    allowed_callers:
      - linkautowork
    failure_mapping:
      invalid_pack: MANIFEST_INVALID

  - operation_id: readiness.probe
    description: API/ping without writes
    default_mode: shadow
    lease_skus:
      - supabase.readiness.check
    idempotency_key_pattern: "${tenant_id}:${probe_window_floor_ts}"
    allowed_callers:
      - linkautowork
      - vertical_plugin
      - linkaios
    failure_mapping:
      connectivity: INTEGRATION_UNAVAILABLE
      auth: INTEGRATION_AUTH_FAILED

auth_config_surface:
  - supabase.organization_ref
  - supabase.management_api_ref
  - supabase.fixture_profile_ref

audit_events:
  - capability.requested
  - capability.executed
  - linkapps.services.provisioned
  - supabase.migration.applied
  - capability.failed

non_ownership:
  - Application business schema/content model invented without discovery
  - SaaS tenancy pricing and quotas
  - HIPAA/BA exposure decisions
  - Postgres extension enablement unrelated to scaffolded template

required_by_modules:
  - linkapps.app_factory
  - linksites

notes: >
  Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.2: migration.apply_workspace mirrors
  release-readiness.sh test isolation (TEMPLATE_OFFLINE=1 posture).
  Stays off shared cloud projects in MVO.

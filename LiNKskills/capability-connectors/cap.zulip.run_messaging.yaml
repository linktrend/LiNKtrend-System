# Capability Connector: cap.zulip.run_messaging
# Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.7 and CONTRACTS_MVO.md §0.A.5.1

plugin_id: cap.zulip.run_messaging
plugin_kind: capability
plugin_name: Zulip Run Messaging
version: "1.0.0-mvo"
purpose: Governed Zulip notifications and messaging for runs and squads

modes_supported:
  - mock
  - shadow
  - live

operations:
  - operation_id: run.notify
    description: Queue payload locally for run notifications
    default_mode: mock
    lease_skus:
      - zulip.run.notify
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:run.notify:${message_purpose}"
    allowed_callers:
      - linkaios
      - vertical_plugin
      - linkbot
      - linkautowork
    failure_mapping:
      stream_config_missing: MANIFEST_INVALID
      auth: INTEGRATION_AUTH_FAILED

  - operation_id: channel.message.mock_send
    description: Record message payload (not sent in MVO)
    default_mode: mock
    lease_skus:
      - zulip.channel.message.send
    idempotency_key_pattern: "${tenant_id}:${run_id}:${stage_id}:channel.message.mock_send:${purpose}:${deterministic_topic}"
    allowed_callers:
      - linkaios
      - vertical_plugin
      - linkbot
      - linkautowork
    failure_mapping:
      topic_config_missing: MANIFEST_INVALID
      auth: INTEGRATION_AUTH_FAILED

  - operation_id: connectivity.probe
    description: Zulip server connectivity check
    default_mode: shadow
    lease_skus:
      - zulip.connectivity.probe
    idempotency_key_pattern: "${tenant_id}:${probe_window_floor_ts}"
    allowed_callers:
      - linkaios
      - vertical_plugin
      - linkbot
      - linkautowork
    failure_mapping:
      connectivity: INTEGRATION_UNAVAILABLE
      auth: INTEGRATION_AUTH_FAILED

auth_config_surface:
  - zulip.base_url
  - zulip.bot_email_ref
  - zulip.api_key_ref
  - zulip.stream_ref
  - zulip.topic_template
  - tenant.stream_routing_ref

studio_secret_source:
  provider: google_secret_manager
  version: latest
  refs:
    zulip.bot_email_ref: LINKTREND_AIOS_PROD_ZULIP_BOT_EMAIL
    zulip.api_key_ref: LINKTREND_AIOS_PROD_ZULIP_API_KEY

mvo_runtime_modes:
  - mock
  - shadow

audit_events:
  - capability.requested
  - lease.executed
  - capability.executed
  - zulip.notification.queued
  - zulip.connectivity.checked
  - capability.failed

non_ownership:
  - Stream hierarchy redesign
  - Moderation/bot onboarding for non-Linkapps topics
  - Exporting message archives beyond governed audit slice
  - Organization-wide taxonomy design

required_by_modules:
  - linkapps.app_factory
  - lexos.litigation
  - linksites
  - linktrend_media

notes: >
  Per LINKAPPS_CAPABILITY_REQUIREMENTS.md §2.7: Outbound messages default to mock
  (queue locally). Live outbound requires explicit tenant opt-in post-MVO.
  Connectivity probes run in shadow mode.

# LiNKapps App Factory vertical plugin — declaration-only manifest (WP-106).
# Sources: LINKAPPS_VERTICAL_PLUGIN_CONVERSION_PLAN.md §1–§7, CONTRACTS_MVO.md §1.2–§1.3.
# Loader integration and machine validation may follow in later packets.

plugin_id: linkapps.app_factory
plugin_kind: vertical
plugin_name: LiNKapps App Factory
version: "1.0.0-mvo"
purpose: >-
  Transform venture blueprints (PRD plus business context) into working software through
  autonomous squad execution in Phase 5, producing repos, provisioned services, validated builds,
  development-mode deployments, and handoff artifacts toward venture spinoff.

modes_supported:
  - development

public_surfaces:
  work_request_types:
    - linkapps.app_factory.blueprint_to_app
    - linkapps.app_factory.prd_to_repo
    - linkapps.app_factory.squad_execution
    - linkapps.app_factory.spinoff_prep
  ui_panels:
    - linkapps.factory_dashboard
    - linkapps.blueprint_intake
    - linkapps.squad_monitor
    - linkapps.build_logs
    - linkapps.validation_results
    - linkapps.deployment_history
    - linkapps.spinoff_queue
  read_views:
    - linkapps.ventures.list
    - linkapps.squads.list
    - linkapps.templates.catalog

stages:
  - stage_id: linkapps.phase5.squad_formation
    display_name: "Phase 5.1 — Squad formation"
    responsible_plane: linkbot
    inputs:
      - blueprint_ref
      - venture_id
      - squad_task_queue_ref
    outputs:
      - squad_config
      - role_assignments
    failure_mode: abort_run

  - stage_id: linkapps.phase5.repo_generation
    display_name: "Phase 5.2 — Repository generation"
    responsible_plane: linkautowork
    inputs:
      - blueprint_ref
      - prd_ref
      - squad_config
      - app_slug
      - app_name
    outputs:
      - app_repo_ref
      - git_commit_sha
    failure_mode: retryable

  - stage_id: linkapps.phase5.service_provisioning
    display_name: "Phase 5.3 — Service provisioning"
    responsible_plane: linkautowork
    inputs:
      - app_repo_ref
      - tenant_id
      - provisioning_profile_ref
    outputs:
      - service_credentials_ref
      - supabase_project_ref
      - stripe_product_ids_ref
    failure_mode: retryable

  - stage_id: linkapps.phase5.ai_implementation
    display_name: "Phase 5.4 — AI-assisted implementation iterations"
    responsible_plane: linkbot
    inputs:
      - app_repo_ref
      - prd_ref
      - squad_config
      - provisioning_profile_ref
    outputs:
      - implementation_bundle_ref
      - built_app_bundle
      - files_changed_manifest_ref
    failure_mode: retryable

  - stage_id: linkapps.phase5.quality_validation
    display_name: "Phase 5.5 — Quality validation"
    responsible_plane: linkautowork
    inputs:
      - app_repo_ref
      - test_matrix_ref
      - lease_ids
    outputs:
      - validation_report_ref
      - checks_passed
    failure_mode: abort_run

  - stage_id: linkapps.phase5.deployment
    display_name: "Phase 5.6 — Deployment (development mode)"
    responsible_plane: linkautowork
    inputs:
      - app_repo_ref
      - deployment_target_ref
      - lease_ids
    outputs:
      - deployment_refs
      - preview_urls
    failure_mode: retryable

  - stage_id: linkapps.phase5.handoff_pack
    display_name: "Phase 5.7 — Handoff package compilation"
    responsible_plane: linkautowork
    inputs:
      - app_repo_ref
      - service_refs
      - deployment_refs
    outputs:
      - handoff_package_ref
      - audit_event_ids
    failure_mode: retryable

config_surfaces:
  - linkapps.app_slug_validation_rules
  - linkapps.default_starter_template_ref
  - linkapps.provisioning_mock_profile
  - linkapps.deployment_mock_profile
  - linkapps.model_routing_profile

required_capabilities:
  - cap.github.repo_management
  - cap.supabase.provisioning
  - cap.stripe.product_management
  - cap.vercel.deployment
  - cap.eas.build
  - cap.plane.execution_tracking
  - cap.zulip.run_messaging
  - cap.research.public_web
  - cap.asset.generation
  - cap.postiz.distribution

required_workflow_hooks:
  - autowork.linkapps.create_repo
  - autowork.linkapps.provision_services
  - autowork.linkapps.build_iteration
  - autowork.linkapps.release_readiness
  - autowork.linkapps.deploy
  - autowork.linkapps.compile_handoff

# Includes cross-plane lifecycle events (§6.3.1) plus WP-085 domain verbs and role trace.
# Schema gap: strict boot-time loaders that only whitelist §6.3.1 "initial set" must extend the
# catalog (DECISION row / WP-111) before accepting linkapps.* and role.* verbatim.
required_audit_events:
  - run.started
  - run.completed
  - run.failed
  - stage.started
  - stage.completed
  - stage.failed
  - workflow.invoked
  - workflow.completed
  - workflow.failed
  - lease.requested
  - lease.granted
  - lease.executed
  - lease.denied
  - role.started
  - role.completed
  - role.failed
  - linkapps.blueprint.received
  - linkapps.squad.formed
  - linkapps.repo.created
  - linkapps.services.provisioned
  - linkapps.build.iteration
  - linkapps.validation.passed
  - linkapps.deployed
  - linkapps.handoff.ready
  - linkapps.spunoff

required_linkbot_roles:
  - role_id: technical_lead
    purpose: Cross-cutting architecture, squad coordination, and gated use of connectors.
    inputs:
      - blueprint_ref
      - app_repo_ref
      - squad_config
    outputs:
      - coordination_decisions_ref
      - architecture_notes_ref
    allowed_capabilities:
      - cap.github.repo_management
      - cap.supabase.provisioning
      - cap.stripe.product_management
      - cap.vercel.deployment
      - cap.eas.build
      - cap.plane.execution_tracking
      - cap.zulip.run_messaging
      - cap.research.public_web
      - cap.asset.generation
      - cap.postiz.distribution
    allowed_skills:
      - architecture
      - plan-writing
      - clean-code
    model_policy:
      model_routing_profile: coding-heavy
      tools:
        - Read
        - StrReplace
        - Shell
    audit_events:
      - role.started
      - role.completed
      - role.failed
    development_restrictions:
      - no_direct_lease_issue
      - local_artifact_target_only

  - role_id: product_owner
    purpose: PRD ownership, backlog and scope discipline for the generated app.
    inputs:
      - prd_ref
      - blueprint_ref
    outputs:
      - refined_scope_ref
    allowed_capabilities:
      - cap.plane.execution_tracking
      - cap.zulip.run_messaging
    allowed_skills:
      - plan-writing
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - no_production_deploy

  - role_id: frontend_specialist
    purpose: Web UI implementation against the starter template and design tokens.
    inputs:
      - app_repo_ref
      - design_tokens_ref
      - prd_ref
    outputs:
      - frontend_implementation_bundle_ref
      - ui_smoke_report_ref
    allowed_capabilities:
      - cap.asset.generation
      - cap.github.repo_management
    allowed_skills:
      - frontend-design
      - tailwind-patterns
      - nextjs-react-expert
    model_policy:
      model_routing_profile: coding-heavy
      tools:
        - Read
        - StrReplace
        - Shell
    audit_events:
      - role.started
      - role.completed
      - role.failed
    development_restrictions:
      - local_artifact_target_only

  - role_id: backend_specialist
    purpose: APIs, persistence boundaries, and service integration posture.
    inputs:
      - app_repo_ref
      - prd_ref
    outputs:
      - backend_implementation_bundle_ref
    allowed_capabilities:
      - cap.supabase.provisioning
      - cap.stripe.product_management
      - cap.github.repo_management
    allowed_skills:
      - nodejs-best-practices
      - api-patterns
    model_policy:
      model_routing_profile: coding-heavy
      tools:
        - Read
        - StrReplace
        - Shell
    audit_events:
      - role.started
      - role.completed
      - role.failed
    development_restrictions:
      - no_direct_production_writes

  - role_id: mobile_developer
    purpose: Expo-style client surfaces when tenant enables mobile tracks (outside core MVO).
    inputs:
      - app_repo_ref
      - prd_ref
    outputs:
      - mobile_bundle_ref
    allowed_capabilities:
      - cap.eas.build
      - cap.github.repo_management
    allowed_skills:
      []
    model_policy:
      model_routing_profile: coding-heavy
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - mobile_track_optional_off_by_default_mvo

  - role_id: database_architect
    purpose: Schema and data-layer design aligned with existing Supabase patterns (discovery-gated).
    inputs:
      - app_repo_ref
      - blueprint_ref
    outputs:
      - schema_design_notes_ref
    allowed_capabilities:
      - cap.supabase.provisioning
    allowed_skills:
      - database-design
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - no_schema_invention_without_discovery

  - role_id: test_engineer
    purpose: Testing strategy and test plan coverage for iterations.
    inputs:
      - app_repo_ref
      - prd_ref
    outputs:
      - test_plan_ref
    allowed_capabilities: []
    allowed_skills:
      - testing-patterns
      - tdd-workflow
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - no_external_ci_secret_access

  - role_id: qa_automation_engineer
    purpose: Automated checks, CI pipelines, and regression posture.
    inputs:
      - app_repo_ref
      - test_matrix_ref
    outputs:
      - automation_report_ref
    allowed_capabilities:
      - cap.github.repo_management
    allowed_skills:
      - webapp-testing
      - playwright
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
        - Shell
    audit_events:
      - role.started
      - role.completed
      - role.failed
    development_restrictions:
      - mock_ci_only_in_mvo

  - role_id: devops_engineer
    purpose: Deployment targets, pipelines, and environment wiring in development mode.
    inputs:
      - app_repo_ref
      - deployment_target_ref
    outputs:
      - pipeline_config_notes_ref
    allowed_capabilities:
      - cap.vercel.deployment
      - cap.github.repo_management
    allowed_skills:
      - bash-linux
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - Shell
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - development_deploy_only

  - role_id: security_auditor
    purpose: Security review checkpoints before validation gate.
    inputs:
      - app_repo_ref
      - validation_scope_ref
    outputs:
      - security_review_ref
    allowed_capabilities:
      - cap.github.repo_management
    allowed_skills:
      - vulnerability-scanner
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - advisory_only_until_policy_wired

  - role_id: documentation_writer
    purpose: Operator-facing handoff documentation for Phase 5.7 outputs.
    inputs:
      - app_repo_ref
      - handoff_scope_ref
    outputs:
      - operator_docs_bundle_ref
    allowed_capabilities:
      - cap.github.repo_management
      - cap.zulip.run_messaging
    allowed_skills:
      - documentation-templates
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - no_publish_without_approval

  - role_id: market_research_bot
    purpose: Venture discovery research with provenance (Phases 1–2 runway; not Phase 5 only).
    inputs:
      - market_segment_ref
      - competitor_list_ref
    outputs:
      - research_bundle_ref
    allowed_capabilities:
      - cap.research.public_web
    allowed_skills: []
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - research_read_only
      - provenance_required

  - role_id: feasibility_bot
    purpose: Stress-test blueprint assumptions before technical build.
    inputs:
      - blueprint_ref
      - feasibility_scope_ref
    outputs:
      - feasibility_report_ref
    allowed_capabilities:
      - cap.research.public_web
      - cap.zulip.run_messaging
    allowed_skills:
      - plan-writing
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - provenance_required

  - role_id: growth_bot
    purpose: Post-build GTM scaffolding; distribution remains mock in MVO.
    inputs:
      - app_repo_ref
      - gtm_strategy_ref
    outputs:
      - growth_plan_ref
    allowed_capabilities:
      - cap.postiz.distribution
      - cap.zulip.run_messaging
    allowed_skills:
      - plan-writing
    model_policy:
      model_routing_profile: balanced
      tools:
        - Read
        - StrReplace
    audit_events:
      - role.started
      - role.completed
    development_restrictions:
      - no_live_publish_or_send

preview_output_shape:
  run_id: string
  tenant_id: string
  venture_id: string
  blueprint_ref: string
  squad_config_ref: string
  app_repo_ref: string | null
  implementation_bundle_ref: string | null
  validation_report_ref: string | null
  deployment_refs: string[]
  preview_urls: string[]
  handoff_package_ref: string | null
  lease_ids: string[]
  workflow_run_ids: string[]
  audit_event_ids: string[]
  status: "one_of[running,succeeded,partial,failed]"

non_goals:
  - >-
    Implementing LiNKapps starter scripts, workflows, or LiNKaios stage handlers in this repo
    (declaration only for WP-106).
  - Moving or editing the external LiNKapps checkout; reuse references come from LINKAPPS_VERTICAL_PLUGIN_CONVERSION_PLAN.md.
  - >-
    Shadow or live modes for this vertical in MVO; only development mode is advertised in
    modes_supported despite forward-looking roadmap in WP-085.
  - Inventing Stripe, Supabase, Vercel, GitHub, or EAS business configuration inside tenant apps beyond connector surfaces.
